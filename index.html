<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="러닝">
<meta name="theme-color" content="#080d17">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>러닝 트래커</title>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{background:#080d17;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif}button,input,textarea,select{font-family:inherit}::-webkit-scrollbar{display:none}</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const{useState,useEffect,useMemo}=React;

const GOAL_DATE=new Date(2027,4,1); // May 1, 2027
const GOAL_5K=30; // minutes
const GOAL_10K=55; // minutes

// ── Helpers ──
function pad(n){return String(n).padStart(2,"0")}
function dk(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function sameDay(a,b){return dk(a)===dk(b)}
function daysBetween(a,b){return Math.round((b-a)/86400000)}
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function getMonday(d){const x=new Date(d);const day=x.getDay();const diff=day===0?-6:1-day;x.setDate(x.getDate()+diff);return new Date(x.getFullYear(),x.getMonth(),x.getDate())}

// ── App ──
function App(){
  const[tab,setTab]=useState("log");
  const[runs,setRuns]=useState(()=>load("rk-runs")||{});
  const[tests,setTests]=useState(()=>load("rk-tests")||[]);
  useEffect(()=>{save("rk-runs",runs)},[runs]);
  useEffect(()=>{save("rk-tests",tests)},[tests]);
  const today=new Date();
  const dLeft=daysBetween(today,GOAL_DATE);

  // Weekly run count (this week)
  const mon=getMonday(today);
  let weekRuns=0;
  for(let i=0;i<7;i++){const d=addDays(mon,i);if(runs[dk(d)])weekRuns++}

  // Feasibility
  const feas=useMemo(()=>{
    // Count weekly averages over past 8 weeks
    const now=new Date();
    let totalWeeks=0,totalRuns=0,totalMin=0;
    for(let w=0;w<8;w++){
      const wMon=addDays(getMonday(now),-w*7);
      let wr=0,wm=0;
      for(let i=0;i<7;i++){const d=addDays(wMon,i);const r=runs[dk(d)];if(r){wr++;wm+=parseFloat(r.minutes)||0}}
      if(w>0||now.getDay()===0){totalWeeks++;totalRuns+=wr;totalMin+=wm} // skip partial current week unless Sunday
    }
    const avgRuns=totalWeeks>0?totalRuns/totalWeeks:0;
    const avgMin=totalWeeks>0?totalMin/totalWeeks:0;
    const consistency=Math.min(avgRuns/4,1); // 4 runs/week = 100%

    // Latest test results
    const t5=tests.filter(t=>t.type==="5K").sort((a,b)=>b.date.localeCompare(a.date))[0];
    const t10=tests.filter(t=>t.type==="10K").sort((a,b)=>b.date.localeCompare(a.date))[0];
    const has5=t5&&parseFloat(t5.time)>0;
    const has10=t10&&parseFloat(t10.time)>0;

    // 5K feasibility
    let f5={possible:null,current:null,trend:"데이터 부족"};
    if(has5){
      const cur=parseFloat(t5.time);
      f5.current=cur;
      // If already achieved
      if(cur<=GOAL_5K){f5.possible=true;f5.trend="이미 달성 ✓"}
      else{
        // Need to improve. With consistent 4x/week training, typical improvement is ~1-2% per month
        const monthsLeft=dLeft/30;
        const neededImprovement=((cur-GOAL_5K)/cur)*100;
        const expectedImprovement=consistency*1.5*monthsLeft; // 1.5% per month at full consistency
        f5.possible=expectedImprovement>=neededImprovement;
        f5.trend=f5.possible?`${Math.round(neededImprovement)}% 단축 필요 · 충분한 시간`:`주 4회 유지 시 가능성 있음`;
      }
    }

    // 10K feasibility
    let f10={possible:null,current:null,trend:"데이터 부족"};
    if(has10){
      const cur=parseFloat(t10.time);
      f10.current=cur;
      if(cur<=GOAL_10K){f10.possible=true;f10.trend="이미 달성 ✓"}
      else{
        const monthsLeft=dLeft/30;
        const needed=((cur-GOAL_10K)/cur)*100;
        const expected=consistency*1.2*monthsLeft;
        f10.possible=expected>=needed;
        f10.trend=f10.possible?`${Math.round(needed)}% 단축 필요 · 충분한 시간`:`주 4회 꾸준히 유지 필요`;
      }
    }

    // Overall: both achievable or not enough data
    const overall=f5.possible===null&&f10.possible===null?null:
      (f5.possible!==false&&f10.possible!==false);

    return{consistency,avgRuns:Math.round(avgRuns*10)/10,avgMin:Math.round(avgMin),f5,f10,overall,totalWeeks};
  },[runs,tests]);

  const tabs=[{id:"log",label:"기록",icon:"+"},{id:"cal",label:"캘린더",icon:"▦"},{id:"test",label:"테스트",icon:"🏁"},{id:"goal",label:"목표",icon:"◎"}];
  return(
    <div style={S.app}>
      {/* Header */}
      <div style={S.header}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{color:"#f1f5f9",fontSize:16,fontWeight:800}}>러닝 트래커</div>
            <div style={{color:"#64748b",fontSize:10,marginTop:1}}>주 4회 · 30~40분 · 심폐 건강</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{color:"#67e8f9",fontSize:11,fontWeight:700}}>이번 주 {weekRuns}/4회</div>
            <div style={{display:"flex",gap:3,marginTop:3,justifyContent:"flex-end"}}>
              {[0,1,2,3].map(i=>(
                <div key={i} style={{width:12,height:12,borderRadius:3,background:i<weekRuns?"#22c55e":"rgba(255,255,255,0.08)"}}/>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* Feasibility bar */}
      <div style={{padding:"8px 14px 0"}}>
        <FeasBar feas={feas} dLeft={dLeft}/>
      </div>

      {/* Nav */}
      <div style={S.nav}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{...S.navBtn,...(tab===t.id?S.navActive:{})}}>
            <span style={{fontSize:15,fontWeight:900}}>{t.icon}</span>
            <span style={{fontSize:10,fontWeight:700}}>{t.label}</span>
          </button>
        ))}
      </div>

      <div style={S.content}>
        {tab==="log"&&<LogTab runs={runs} setRuns={setRuns} today={today} weekRuns={weekRuns}/>}
        {tab==="cal"&&<CalTab runs={runs} tests={tests} today={today}/>}
        {tab==="test"&&<TestTab tests={tests} setTests={setTests}/>}
        {tab==="goal"&&<GoalTab feas={feas} dLeft={dLeft}/>}
      </div>
    </div>
  );
}

// ═══ FEASIBILITY BAR ═══
function FeasBar({feas,dLeft}){
  const c=feas.overall===null?"#64748b":feas.overall?"#22c55e":"#ef4444";
  const bg=feas.overall===null?"rgba(100,116,139,0.06)":feas.overall?"rgba(34,197,94,0.06)":"rgba(239,68,68,0.06)";
  const bc=feas.overall===null?"rgba(100,116,139,0.2)":feas.overall?"rgba(34,197,94,0.3)":"rgba(239,68,68,0.3)";
  return(
    <div style={{borderRadius:10,padding:"9px 12px",background:bg,border:`1px solid ${bc}`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:10,height:10,borderRadius:5,background:c}}/>
          <span style={{color:c,fontSize:12,fontWeight:800}}>
            {feas.overall===null?"테스트 기록 필요":feas.overall?"목표 달성 가능":"주 4회 유지 필요"}
          </span>
        </div>
        <span style={{color:"#64748b",fontSize:10,fontWeight:600}}>D-{dLeft}</span>
      </div>
      {feas.totalWeeks>0&&(
        <div style={{color:"#94a3b8",fontSize:10,marginTop:4}}>
          최근 {feas.totalWeeks}주 평균: {feas.avgRuns}회/주 · {feas.avgMin}분/주
        </div>
      )}
    </div>
  );
}

// ═══ LOG TAB ═══
function LogTab({runs,setRuns,today,weekRuns}){
  const todayKey=dk(today);
  const todayRun=runs[todayKey];
  const[minutes,setMinutes]=useState("");
  const[km,setKm]=useState("");
  const[type,setType]=useState("이지런");
  const[note,setNote]=useState("");
  const[saved,setSaved]=useState(false);

  const doSave=()=>{
    setRuns(p=>({...p,[todayKey]:{minutes,km,type,note,ts:Date.now()}}));
    setSaved(true);setTimeout(()=>setSaved(false),1500);
  };
  const doDelete=()=>{setRuns(p=>{const n={...p};delete n[todayKey];return n})};

  const types=["이지런","인터벌","빠른런","회복런"];
  const dayName=["일","월","화","수","목","금","토"][today.getDay()];

  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{textAlign:"center",padding:"6px 0"}}>
        <div style={{color:"#f1f5f9",fontSize:20,fontWeight:800}}>
          {today.getMonth()+1}월 {today.getDate()}일 ({dayName})
        </div>
        <div style={{color:"#67e8f9",fontSize:12,fontWeight:600,marginTop:4}}>
          이번 주 {weekRuns}/4회 완료
          {weekRuns>=4&&" 🎉"}
        </div>
      </div>

      {todayRun?(
        <div style={{...S.card,borderLeft:"4px solid #22c55e"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <span style={{color:"#22c55e",fontSize:14,fontWeight:800}}>✓ 오늘 기록 완료</span>
            <button onClick={doDelete} style={{background:"none",border:"none",color:"#64748b",fontSize:11,cursor:"pointer"}}>삭제</button>
          </div>
          <div style={{color:"#cbd5e1",fontSize:13}}>
            {todayRun.type} · {todayRun.minutes}분{todayRun.km?` · ${todayRun.km}km`:""}
          </div>
          {todayRun.note&&<div style={{color:"#64748b",fontSize:11,marginTop:4,fontStyle:"italic"}}>{todayRun.note}</div>}
        </div>
      ):(
        <div style={{...S.card,borderLeft:"4px solid #06b6d4"}}>
          <div style={{color:"#f1f5f9",fontSize:14,fontWeight:800,marginBottom:12}}>오늘 러닝 기록</div>

          {/* Type */}
          <div style={{display:"flex",gap:6,marginBottom:12}}>
            {types.map(t=>(
              <button key={t} onClick={()=>setType(t)} style={{
                flex:1,padding:"8px 0",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",textAlign:"center",
                border:`1.5px solid ${type===t?"#06b6d4":"rgba(255,255,255,0.08)"}`,
                background:type===t?"rgba(6,182,212,0.12)":"rgba(255,255,255,0.03)",
                color:type===t?"#67e8f9":"#94a3b8",
              }}>{t}</button>
            ))}
          </div>

          {/* Minutes */}
          <div style={{marginBottom:10}}>
            <div style={{color:"#cbd5e1",fontSize:11,fontWeight:700,marginBottom:4}}>시간 (분) *</div>
            <input type="number" value={minutes} onChange={e=>setMinutes(e.target.value)}
              style={S.input} placeholder="예: 35"/>
          </div>

          {/* Distance */}
          <div style={{marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
              <span style={{color:"#cbd5e1",fontSize:11,fontWeight:700}}>거리 (km)</span>
              <span style={{color:"#64748b",fontSize:9}}>선택사항</span>
            </div>
            <input type="number" step="0.1" value={km} onChange={e=>setKm(e.target.value)}
              style={S.input} placeholder="예: 5.2"/>
          </div>

          {/* Note */}
          <div style={{marginBottom:12}}>
            <div style={{color:"#cbd5e1",fontSize:11,fontWeight:700,marginBottom:4}}>메모</div>
            <input type="text" value={note} onChange={e=>setNote(e.target.value)}
              style={S.input} placeholder="컨디션, 날씨, 통증..."/>
          </div>

          {saved?(
            <div style={{textAlign:"center",padding:"14px 0",color:"#22c55e",fontSize:16,fontWeight:900}}>✓ 저장!</div>
          ):(
            <button onClick={doSave} disabled={!minutes} style={{
              ...S.saveBtn,
              opacity:minutes?1:0.4,
              background:minutes?"linear-gradient(135deg,#0891b2,#06b6d4)":"rgba(255,255,255,0.1)",
            }}>💾 기록 저장</button>
          )}
        </div>
      )}

      {/* Tips */}
      <div style={{...S.card,background:"rgba(255,255,255,0.015)"}}>
        <div style={{color:"#64748b",fontSize:10,fontWeight:700,marginBottom:6}}>오늘의 팁</div>
        {type==="인터벌"?(
          <div style={{color:"#f59e0b",fontSize:11,lineHeight:1.6}}>
            ⚡ 인터벌: 1분 빠르게 → 2분 천천히 × 8~10회{"\n"}
            전체 30~35분 안에 끝내세요
          </div>
        ):type==="빠른런"?(
          <div style={{color:"#06b6d4",fontSize:11,lineHeight:1.6}}>
            🏃 빠른런: 평소보다 30초/km 빠르게{"\n"}
            대화는 어렵지만 유지 가능한 속도
          </div>
        ):(
          <div style={{color:"#22c55e",fontSize:11,lineHeight:1.6}}>
            🌿 이지런: 대화 가능한 편안한 속도{"\n"}
            30~40분 꾸준히 · 이게 심폐 건강의 핵심
          </div>
        )}
      </div>
    </div>
  );
}

// ═══ CALENDAR TAB ═══
function CalTab({runs,tests,today}){
  const[calM,setCalM]=useState(new Date(today.getFullYear(),today.getMonth(),1));
  const yr=calM.getFullYear(),mo=calM.getMonth();
  const fw=new Date(yr,mo,1).getDay();
  const dim=new Date(yr,mo+1,0).getDate();
  const cells=[];
  for(let i=0;i<fw;i++)cells.push({d:addDays(new Date(yr,mo,1),-(fw-i)),out:true});
  for(let d=1;d<=dim;d++)cells.push({d:new Date(yr,mo,d),out:false});
  while(cells.length%7)cells.push({d:addDays(new Date(yr,mo,dim),cells.length-fw-dim+1),out:true});

  // Month stats
  let mRuns=0,mMin=0,mKm=0;
  for(let d=1;d<=dim;d++){const r=runs[dk(new Date(yr,mo,d))];if(r){mRuns++;mMin+=parseFloat(r.minutes)||0;mKm+=parseFloat(r.km)||0}}
  // Tests this month
  const mTests=tests.filter(t=>{const td=new Date(t.date);return td.getMonth()===mo&&td.getFullYear()===yr});

  const[selD,setSelD]=useState(null);
  const selRun=selD?runs[dk(selD)]:null;
  const selTest=selD?tests.find(t=>t.date===dk(selD)):null;

  return(
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      <div style={{display:"flex",alignItems:"center",gap:6}}>
        <button onClick={()=>setCalM(new Date(yr,mo-1,1))} style={S.calBtn}>‹</button>
        <div style={{flex:1,textAlign:"center"}}>
          <div style={{color:"#f1f5f9",fontSize:16,fontWeight:800}}>{yr}년 {mo+1}월</div>
          <div style={{color:"#94a3b8",fontSize:10,marginTop:2}}>{mRuns}회 · {mMin}분{mKm>0?` · ${mKm.toFixed(1)}km`:""}</div>
        </div>
        <button onClick={()=>setCalM(new Date(yr,mo+1,1))} style={S.calBtn}>›</button>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,textAlign:"center"}}>
        {["일","월","화","수","목","금","토"].map((d,i)=>(
          <div key={i} style={{fontSize:10,fontWeight:800,padding:"4px 0",color:i===0?"#ef4444":i===6?"#06b6d4":"#64748b"}}>{d}</div>
        ))}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
        {cells.map((c,i)=>{
          const key=dk(c.d);
          const hasRun=!!runs[key];
          const hasTest=tests.some(t=>t.date===key);
          const isT=sameDay(c.d,today);
          const isSel=selD&&sameDay(c.d,selD);
          const isSun=c.d.getDay()===0;const isSat=c.d.getDay()===6;
          return(
            <div key={i} onClick={()=>!c.out&&setSelD(c.d)} style={{
              minHeight:44,padding:"3px",borderRadius:5,cursor:c.out?"default":"pointer",
              background:isSel?"rgba(103,232,249,0.12)":isT?"rgba(103,232,249,0.06)":hasRun?"rgba(34,197,94,0.04)":"transparent",
              border:isSel?"1px solid rgba(103,232,249,0.5)":isT?"1px solid rgba(103,232,249,0.3)":"1px solid rgba(255,255,255,0.03)",
              opacity:c.out?0.2:1,
            }}>
              <div style={{fontSize:11,fontWeight:isT?900:500,color:isT?"#67e8f9":isSun?"#ef4444":isSat?"#06b6d4":"#cbd5e1",fontFamily:"ui-monospace,monospace"}}>{c.d.getDate()}</div>
              <div style={{display:"flex",gap:2,marginTop:2,justifyContent:"center"}}>
                {hasRun&&<div style={{width:6,height:6,borderRadius:3,background:"#22c55e"}}/>}
                {hasTest&&<div style={{width:6,height:6,borderRadius:3,background:"#f59e0b"}}/>}
              </div>
            </div>
          );
        })}
      </div>

      {/* Legend */}
      <div style={{display:"flex",gap:12,justifyContent:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#94a3b8"}}>
          <div style={{width:6,height:6,borderRadius:3,background:"#22c55e"}}/>러닝
        </div>
        <div style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#94a3b8"}}>
          <div style={{width:6,height:6,borderRadius:3,background:"#f59e0b"}}/>테스트
        </div>
      </div>

      {/* Selected day detail */}
      {selD&&(selRun||selTest)&&(
        <div style={S.card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div style={{color:"#f1f5f9",fontSize:14,fontWeight:800}}>
              {selD.getMonth()+1}/{selD.getDate()} ({["일","월","화","수","목","금","토"][selD.getDay()]})
            </div>
            <button onClick={()=>setSelD(null)} style={S.calBtn}>✕</button>
          </div>
          {selRun&&(
            <div style={{padding:"8px 10px",borderRadius:8,background:"rgba(34,197,94,0.06)",borderLeft:"3px solid #22c55e",marginBottom:6}}>
              <div style={{color:"#22c55e",fontSize:12,fontWeight:700}}>{selRun.type} · {selRun.minutes}분{selRun.km?` · ${selRun.km}km`:""}</div>
              {selRun.note&&<div style={{color:"#64748b",fontSize:10,marginTop:2}}>{selRun.note}</div>}
            </div>
          )}
          {selTest&&(
            <div style={{padding:"8px 10px",borderRadius:8,background:"rgba(245,158,11,0.06)",borderLeft:"3px solid #f59e0b"}}>
              <div style={{color:"#f59e0b",fontSize:12,fontWeight:700}}>🏁 {selTest.type} 테스트 · {selTest.time}분</div>
              <div style={{color:parseFloat(selTest.time)<=(selTest.type==="5K"?GOAL_5K:GOAL_10K)?"#22c55e":"#94a3b8",fontSize:11,marginTop:2,fontWeight:700}}>
                {parseFloat(selTest.time)<=(selTest.type==="5K"?GOAL_5K:GOAL_10K)?"✓ 목표 달성":"목표까지 "+(parseFloat(selTest.time)-(selTest.type==="5K"?GOAL_5K:GOAL_10K)).toFixed(1)+"분"}
              </div>
            </div>
          )}
        </div>
      )}

      {selD&&!selRun&&!selTest&&(
        <div style={{...S.card,textAlign:"center",padding:16}}>
          <div style={{color:"#475569",fontSize:12}}>기록 없음</div>
        </div>
      )}

      {/* Month test results */}
      {mTests.length>0&&(
        <div style={S.card}>
          <div style={{color:"#f59e0b",fontSize:11,fontWeight:700,marginBottom:6}}>🏁 이번 달 테스트</div>
          {mTests.map((t,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",fontSize:12}}>
              <span style={{color:"#cbd5e1"}}>{t.type} · {t.date.substring(5)}</span>
              <span style={{color:parseFloat(t.time)<=(t.type==="5K"?GOAL_5K:GOAL_10K)?"#22c55e":"#f59e0b",fontWeight:700}}>{t.time}분</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ═══ TEST TAB ═══
function TestTab({tests,setTests}){
  const[type,setType]=useState("5K");
  const[time,setTime]=useState("");
  const[saved,setSaved]=useState(false);
  const today=new Date();

  const doSave=()=>{
    setTests(p=>[...p,{type,time,date:dk(today)}]);
    setSaved(true);setTime("");setTimeout(()=>setSaved(false),1500);
  };

  const t5=tests.filter(t=>t.type==="5K").sort((a,b)=>b.date.localeCompare(a.date));
  const t10=tests.filter(t=>t.type==="10K").sort((a,b)=>b.date.localeCompare(a.date));

  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{...S.card,borderTop:"3px solid #f59e0b"}}>
        <div style={{color:"#f1f5f9",fontSize:14,fontWeight:800,marginBottom:10}}>🏁 테스트 기록</div>
        <div style={{color:"#94a3b8",fontSize:11,marginBottom:12,lineHeight:1.5}}>
          매월 1회 5K · 3개월 1회 10K{"\n"}
          전력 질주로 현재 실력을 확인하세요
        </div>

        <div style={{display:"flex",gap:8,marginBottom:12}}>
          {["5K","10K"].map(t=>(
            <button key={t} onClick={()=>setType(t)} style={{
              flex:1,padding:"12px 0",borderRadius:10,fontSize:14,fontWeight:800,cursor:"pointer",textAlign:"center",
              border:`2px solid ${type===t?"#f59e0b":"rgba(255,255,255,0.08)"}`,
              background:type===t?"rgba(245,158,11,0.12)":"rgba(255,255,255,0.03)",
              color:type===t?"#fbbf24":"#94a3b8",
            }}>{t}</button>
          ))}
        </div>

        <div style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
            <span style={{color:"#cbd5e1",fontSize:11,fontWeight:700}}>완주 시간 (분)</span>
            <span style={{color:"#f59e0b",fontSize:10}}>목표: {type==="5K"?GOAL_5K:GOAL_10K}분 이내</span>
          </div>
          <input type="number" step="0.1" value={time} onChange={e=>setTime(e.target.value)}
            style={S.input} placeholder={`예: ${type==="5K"?"28.5":"54"}`}/>
        </div>

        {time&&(
          <div style={{padding:"8px 12px",borderRadius:8,marginBottom:12,
            background:parseFloat(time)<=(type==="5K"?GOAL_5K:GOAL_10K)?"rgba(34,197,94,0.08)":"rgba(239,68,68,0.08)",
            border:`1px solid ${parseFloat(time)<=(type==="5K"?GOAL_5K:GOAL_10K)?"rgba(34,197,94,0.3)":"rgba(239,68,68,0.3)"}`}}>
            <span style={{color:parseFloat(time)<=(type==="5K"?GOAL_5K:GOAL_10K)?"#22c55e":"#ef4444",fontSize:13,fontWeight:800}}>
              {parseFloat(time)<=(type==="5K"?GOAL_5K:GOAL_10K)?"✓ 목표 달성!":"목표까지 "+(parseFloat(time)-(type==="5K"?GOAL_5K:GOAL_10K)).toFixed(1)+"분 남음"}
            </span>
          </div>
        )}

        {saved?(
          <div style={{textAlign:"center",padding:"12px 0",color:"#22c55e",fontSize:15,fontWeight:900}}>✓ 저장!</div>
        ):(
          <button onClick={doSave} disabled={!time} style={{...S.saveBtn,opacity:time?1:0.4,background:time?"linear-gradient(135deg,#d97706,#f59e0b)":"rgba(255,255,255,0.1)"}}>
            🏁 테스트 결과 저장
          </button>
        )}
      </div>

      {/* History */}
      {(t5.length>0||t10.length>0)&&(
        <div style={S.card}>
          <div style={{color:"#f1f5f9",fontSize:13,fontWeight:800,marginBottom:10}}>📊 테스트 기록</div>

          {t5.length>0&&(
            <div style={{marginBottom:12}}>
              <div style={{color:"#f59e0b",fontSize:11,fontWeight:700,marginBottom:6}}>5K (목표: {GOAL_5K}분)</div>
              {t5.map((t,i)=>{
                const met=parseFloat(t.time)<=GOAL_5K;
                return(
                  <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 8px",borderRadius:6,background:"rgba(255,255,255,0.02)",marginBottom:3}}>
                    <span style={{color:"#94a3b8",fontSize:11}}>{t.date}</span>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{color:met?"#22c55e":"#cbd5e1",fontSize:13,fontWeight:800,fontFamily:"ui-monospace,monospace"}}>{t.time}분</span>
                      {met&&<span style={{color:"#22c55e",fontSize:10}}>✓</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {t10.length>0&&(
            <div>
              <div style={{color:"#06b6d4",fontSize:11,fontWeight:700,marginBottom:6}}>10K (목표: {GOAL_10K}분)</div>
              {t10.map((t,i)=>{
                const met=parseFloat(t.time)<=GOAL_10K;
                return(
                  <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 8px",borderRadius:6,background:"rgba(255,255,255,0.02)",marginBottom:3}}>
                    <span style={{color:"#94a3b8",fontSize:11}}>{t.date}</span>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{color:met?"#22c55e":"#cbd5e1",fontSize:13,fontWeight:800,fontFamily:"ui-monospace,monospace"}}>{t.time}분</span>
                      {met&&<span style={{color:"#22c55e",fontSize:10}}>✓</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {(t5.length>=2||t10.length>=2)&&(
            <div style={{marginTop:10,padding:"8px 10px",background:"rgba(255,255,255,0.02)",borderRadius:8}}>
              <div style={{color:"#64748b",fontSize:10,fontWeight:700,marginBottom:4}}>추세</div>
              {t5.length>=2&&(()=>{
                const diff=parseFloat(t5[0].time)-parseFloat(t5[1].time);
                return<div style={{color:diff<0?"#22c55e":"#ef4444",fontSize:11}}>
                  5K: 최근 {diff<0?`${(-diff).toFixed(1)}분 단축 ↓`:`${diff.toFixed(1)}분 느려짐 ↑`}
                </div>;
              })()}
              {t10.length>=2&&(()=>{
                const diff=parseFloat(t10[0].time)-parseFloat(t10[1].time);
                return<div style={{color:diff<0?"#22c55e":"#ef4444",fontSize:11,marginTop:2}}>
                  10K: 최근 {diff<0?`${(-diff).toFixed(1)}분 단축 ↓`:`${diff.toFixed(1)}분 느려짐 ↑`}
                </div>;
              })()}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ═══ GOAL TAB ═══
function GoalTab({feas,dLeft}){
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{textAlign:"center",padding:"8px 0"}}>
        <div style={{color:"#64748b",fontSize:10,fontWeight:800,letterSpacing:"0.1em"}}>목표 달성까지</div>
        <div style={{color:"#67e8f9",fontSize:40,fontWeight:900,fontFamily:"ui-monospace,monospace",lineHeight:1,marginTop:6}}>D-{dLeft}</div>
        <div style={{color:"#94a3b8",fontSize:11,marginTop:4}}>2027년 5월 1일</div>
      </div>

      {/* 5K goal */}
      <div style={{...S.card,borderLeft:`4px solid ${feas.f5.possible===null?"#64748b":feas.f5.possible?"#22c55e":"#ef4444"}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <div style={{color:"#f1f5f9",fontSize:14,fontWeight:800}}>5K · {GOAL_5K}분 이내</div>
          <div style={{
            padding:"3px 8px",borderRadius:6,fontSize:11,fontWeight:800,
            background:feas.f5.possible===null?"rgba(100,116,139,0.1)":feas.f5.possible?"rgba(34,197,94,0.1)":"rgba(239,68,68,0.1)",
            color:feas.f5.possible===null?"#64748b":feas.f5.possible?"#22c55e":"#ef4444",
          }}>
            {feas.f5.possible===null?"—":feas.f5.possible?"가능":"노력 필요"}
          </div>
        </div>
        {feas.f5.current&&(
          <div style={{color:"#94a3b8",fontSize:12}}>
            현재 최근 기록: <span style={{color:"#f1f5f9",fontWeight:700}}>{feas.f5.current}분</span>
            {feas.f5.current<=GOAL_5K?<span style={{color:"#22c55e"}}> ✓ 달성</span>:<span> (목표까지 {(feas.f5.current-GOAL_5K).toFixed(1)}분)</span>}
          </div>
        )}
        <div style={{color:"#64748b",fontSize:10,marginTop:4}}>{feas.f5.trend}</div>
        <div style={{color:"#475569",fontSize:10,marginTop:6}}>📋 매월 1회 테스트로 확인</div>
      </div>

      {/* 10K goal */}
      <div style={{...S.card,borderLeft:`4px solid ${feas.f10.possible===null?"#64748b":feas.f10.possible?"#22c55e":"#ef4444"}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <div style={{color:"#f1f5f9",fontSize:14,fontWeight:800}}>10K · {GOAL_10K}분 이내</div>
          <div style={{
            padding:"3px 8px",borderRadius:6,fontSize:11,fontWeight:800,
            background:feas.f10.possible===null?"rgba(100,116,139,0.1)":feas.f10.possible?"rgba(34,197,94,0.1)":"rgba(239,68,68,0.1)",
            color:feas.f10.possible===null?"#64748b":feas.f10.possible?"#22c55e":"#ef4444",
          }}>
            {feas.f10.possible===null?"—":feas.f10.possible?"가능":"노력 필요"}
          </div>
        </div>
        {feas.f10.current&&(
          <div style={{color:"#94a3b8",fontSize:12}}>
            현재 최근 기록: <span style={{color:"#f1f5f9",fontWeight:700}}>{feas.f10.current}분</span>
            {feas.f10.current<=GOAL_10K?<span style={{color:"#22c55e"}}> ✓ 달성</span>:<span> (목표까지 {(feas.f10.current-GOAL_10K).toFixed(1)}분)</span>}
          </div>
        )}
        <div style={{color:"#64748b",fontSize:10,marginTop:4}}>{feas.f10.trend}</div>
        <div style={{color:"#475569",fontSize:10,marginTop:6}}>📋 3개월 1회 테스트로 확인</div>
      </div>

      {/* Consistency */}
      <div style={S.card}>
        <div style={{color:"#f1f5f9",fontSize:13,fontWeight:800,marginBottom:8}}>📊 루틴 일관성</div>
        <div style={{display:"flex",gap:10}}>
          <div style={{flex:1,textAlign:"center",padding:"10px 0",background:"rgba(255,255,255,0.02)",borderRadius:8}}>
            <div style={{color:"#67e8f9",fontSize:22,fontWeight:900}}>{feas.avgRuns}</div>
            <div style={{color:"#64748b",fontSize:10,marginTop:2}}>평균 회/주</div>
          </div>
          <div style={{flex:1,textAlign:"center",padding:"10px 0",background:"rgba(255,255,255,0.02)",borderRadius:8}}>
            <div style={{color:"#22c55e",fontSize:22,fontWeight:900}}>{Math.round(feas.consistency*100)}%</div>
            <div style={{color:"#64748b",fontSize:10,marginTop:2}}>일관성</div>
          </div>
          <div style={{flex:1,textAlign:"center",padding:"10px 0",background:"rgba(255,255,255,0.02)",borderRadius:8}}>
            <div style={{color:"#f59e0b",fontSize:22,fontWeight:900}}>{feas.avgMin}</div>
            <div style={{color:"#64748b",fontSize:10,marginTop:2}}>평균 분/주</div>
          </div>
        </div>
      </div>

      {/* Simple advice */}
      <div style={{...S.card,background:"rgba(255,255,255,0.015)"}}>
        <div style={{color:"#f1f5f9",fontSize:12,fontWeight:800,marginBottom:6}}>🎯 핵심</div>
        <div style={{color:"#94a3b8",fontSize:11,lineHeight:1.7}}>
          주 4회 × 30~40분 꾸준히 뛰기{"\n"}
          주 1회는 인터벌로 심폐 자극{"\n"}
          매월 5K 테스트 · 3개월마다 10K 테스트{"\n"}
          통증 있으면 쉬기 · 무리하지 않기

// ═══ STYLES ═══
const S={
  app:{background:"#080d17",minHeight:"100vh",maxWidth:480,margin:"0 auto",display:"flex",flexDirection:"column",color:"#f1f5f9",paddingTop:"env(safe-area-inset-top)",paddingBottom:"env(safe-area-inset-bottom)"},
  header:{padding:"14px 16px 10px",background:"linear-gradient(135deg,#0a1220,#0f1a2e)",borderBottom:"1px solid rgba(255,255,255,0.05)"},
  nav:{display:"flex",background:"#0a1220",borderBottom:"1px solid rgba(255,255,255,0.05)",position:"sticky",top:0,zIndex:10},
  navBtn:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"9px 0",background:"none",border:"none",color:"#475569",cursor:"pointer",borderBottom:"2px solid transparent"},
  navActive:{color:"#67e8f9",borderBottomColor:"#06b6d4",background:"rgba(6,182,212,0.04)"},
  content:{flex:1,padding:14,paddingBottom:28},
  card:{background:"rgba(255,255,255,0.025)",borderRadius:12,padding:14,border:"1px solid rgba(255,255,255,0.05)"},
  input:{width:"100%",padding:"12px 14px",background:"rgba(255,255,255,0.04)",border:"1.5px solid rgba(255,255,255,0.1)",borderRadius:10,color:"#f1f5f9",fontSize:15,outline:"none",boxSizing:"border-box",fontWeight:600},
  saveBtn:{width:"100%",padding:"15px 0",border:"none",borderRadius:12,color:"#fff",fontSize:15,fontWeight:800,cursor:"pointer"},
  calBtn:{width:32,height:32,borderRadius:8,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.06)",color:"#94a3b8",fontSize:16,cursor:"pointer",fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"},
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
